name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-workflow:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: final
    env:
      GIGACHAT_CREDENTIALS: ''
      TAVILY_API_KEY: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: final/requirements-tested.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Test offline workflows
        run: python -B -m unittest discover -s tests -q
